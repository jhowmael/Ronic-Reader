[project]
name = "ronic-reader"
version = "1.0.7"
description = "Leitor de PDF com voz humanizada, local e sem custo por uso"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=5.0",          # extração de texto (padrão)
    "pdfplumber>=0.11",    # extração alternativa (--extractor pdfplumber)
    "edge-tts>=7.0",       # vozes neurais gratuitas (online)
]

[project.optional-dependencies]
# Voz 100% offline: pip install -e ".[offline]"
offline = ["piper-tts>=1.3", "kokoro-onnx>=0.4", "lameenc>=1.7"]
# App de janela (macOS): pip install -e ".[app]"
app = ["pywebview>=5", "pillow-heif>=0.18"]
dev = ["pytest>=8", "fpdf2>=2.7"]

[project.scripts]
ronic = "ronic_reader.cli:main"
ronic-app = "ronic_reader.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ronic_reader*"]

[tool.setuptools.package-data]
"ronic_reader.web" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
